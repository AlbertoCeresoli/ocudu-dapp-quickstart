#
# Builds the release images from the public OCUDU dApp platform and SDK and runs
# the release gates in them.
#
#   lint           script checks and upstream refs (seconds)
#   cpu image      fetch sources -> build cpu-release (host, E3 and SDK gates run
#                  in the build) -> re-run the gates in the image -> E3 smoke test
#                  -> publish to this project's registry from the default branch
#   cuda image     cuda-release compile (device-free gates); default branch,
#                  schedules and on demand
#   cuda gpu gates the CUDA runtime gates on a GPU runner; set OCUDU_GPU_RUNNER_TAG
#
# The platform and SDK refs default to main; set OCUDU_PLATFORM_REF and
# OCUDU_SDK_REF (commit, branch or tag) when running a pipeline to build a
# specific pair. A scheduled pipeline (e.g. nightly) catches drift between the
# two main branches.

stages:
  - lint
  - build and test

variables:
  OCUDU_PLATFORM_URL: https://gitlab.com/ocudu/work_groups/wg2_ai_ran/ocudu-dapp-platform.git
  OCUDU_PLATFORM_REF: main
  OCUDU_SDK_URL: https://gitlab.com/ocudu/work_groups/wg2_ai_ran/ocudu-dapp-sdk.git
  OCUDU_SDK_REF: main
  OCUDU_JOBS: "8"
  # The E3 gates need SCTP from the runner's kernel; the large SaaS runners provide it.
  OCUDU_RUNNER_TAG: saas-linux-large-amd64
  DOCKER_VERSION: "28"
  DOCKER_TLS_CERTDIR: /certs
  OCUDU_WORKSPACE: ${CI_PROJECT_DIR}/workspace

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: lint
  image: alpine:3.20
  script:
    - apk add --no-cache bash git shellcheck
    - for script in scripts/*.sh; do bash -n "${script}"; done
    - shellcheck --severity=warning scripts/*.sh
    # Branch and tag refs must exist upstream; a commit hash is verified when the build fetches it.
    - |
      for pair in "${OCUDU_PLATFORM_URL} ${OCUDU_PLATFORM_REF}" "${OCUDU_SDK_URL} ${OCUDU_SDK_REF}"; do
        set -- ${pair}
        if echo "$2" | grep -Eq '^[0-9a-f]{7,40}$'; then echo "$1 at commit $2"; continue; fi
        git ls-remote --exit-code "$1" "$2" || { echo "ref $2 not found in $1"; exit 1; }
      done

.docker build:
  stage: build and test
  image: docker:${DOCKER_VERSION}
  services:
    - docker:${DOCKER_VERSION}-dind
  tags:
    - ${OCUDU_RUNNER_TAG}
  before_script:
    - set -o pipefail
    - apk add --no-cache bash git tar
    - docker info --format 'docker {{.ServerVersion}}, {{.NCPU}} CPUs, {{.MemTotal}} bytes'
    # Fail early and clearly when the runner kernel cannot open SCTP sockets.
    - >-
      docker run --rm python:3.12-alpine python -c
      "import socket; socket.socket(socket.AF_INET, socket.SOCK_STREAM, socket.IPPROTO_SCTP).close()"
      || { echo "This runner cannot open SCTP sockets; set OCUDU_RUNNER_TAG to a runner with the sctp kernel module."; exit 1; }
    - scripts/fetch_sources.sh "${OCUDU_WORKSPACE}"
    - cat "${OCUDU_WORKSPACE}/sources.env"
  artifacts:
    when: always
    paths:
      - workspace/sources.env
      - "*.log"
    expire_in: 30 days

cpu image:
  extends: .docker build
  needs: [lint]
  timeout: 3h
  variables:
    IMAGE: ocudu-dapp-release:cpu-ci
  script:
    - >-
      OCUDU_BUILD_VARIANT=cpu OCUDU_CPU_IMAGE_TAG="${IMAGE}"
      OCUDU_DOCKER_BUILD_ARGS="--progress=plain"
      "${OCUDU_WORKSPACE}/ocudu-docker/scripts/build.sh" 2>&1 | tee cpu-build.log
    - docker image inspect "${IMAGE}" --format '{{json .Config.Labels}}'
    # The release gates again, in the finished image: runtime and E3 tests, the Python E3
    # client, the release docs, and the full SDK suite with its E3 examples.
    - docker run --rm "${IMAGE}" bash /work/ocudu-docker/scripts/run_tests.sh 2>&1 | tee cpu-tests.log
    # E3 smoke test across containers: the loopback agent in one, the Python client in another.
    - docker network create e3-smoke
    # (-i keeps the agent's stdin open; it exits when stdin closes.)
    - >-
      docker run -d --name e3-agent --network e3-smoke -i "${IMAGE}"
      /work/ocudu/build/tests/unittests/dapp/e3ap_test_server --catalog /tmp
      --bind-address 0.0.0.0 --e3ap-port 36423 --e3dp 0
    - sleep 3
    - >-
      docker run --rm --network e3-smoke "${IMAGE}"
      python3 -m ocudu_e3 --host e3-agent --port 36423 catalog 2>&1 | tee e3-smoke.log
    - >-
      docker run --rm --network e3-smoke "${IMAGE}"
      python3 -m ocudu_e3 --host e3-agent --port 36423 subscribe pusch.crc srs.channel --maximum 20 --duration 10
      2>&1 | tee -a e3-smoke.log
    # Records must actually stream, not just appear in the catalog.
    - grep -q '^\[pusch.crc\]' e3-smoke.log
    - grep -q '^\[srs.channel\]' e3-smoke.log
    - docker rm -f e3-agent
    - |
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ] || [ -n "${CI_COMMIT_TAG}" ]; then
        echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
        for tag in "cpu-${CI_COMMIT_SHORT_SHA}" "cpu${CI_COMMIT_TAG:+-${CI_COMMIT_TAG}}" ; do
          docker tag "${IMAGE}" "${CI_REGISTRY_IMAGE}:${tag}"
          docker push "${CI_REGISTRY_IMAGE}:${tag}"
        done
      fi

cuda image:
  extends: .docker build
  needs: [lint]
  timeout: 3h
  variables:
    IMAGE: ocudu-dapp-release:cuda-ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  script:
    # Compiles the CUDA-accelerated host and the CUDA SDK; the build runs the device-free gates.
    - >-
      OCUDU_BUILD_VARIANT=cuda OCUDU_CUDA_IMAGE_TAG="${IMAGE}"
      OCUDU_DOCKER_BUILD_ARGS="--progress=plain"
      "${OCUDU_WORKSPACE}/ocudu-docker/scripts/build.sh" 2>&1 | tee cuda-build.log
    - docker image inspect "${IMAGE}" --format '{{json .Config.Labels}}'
    - |
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ] || [ -n "${CI_COMMIT_TAG}" ]; then
        echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
        for tag in "cuda-${CI_COMMIT_SHORT_SHA}" "cuda${CI_COMMIT_TAG:+-${CI_COMMIT_TAG}}" ; do
          docker tag "${IMAGE}" "${CI_REGISTRY_IMAGE}:${tag}"
          docker push "${CI_REGISTRY_IMAGE}:${tag}"
        done
      fi

# The CUDA runtime gates need a GPU. Register a runner with an NVIDIA GPU and the container
# toolkit (Docker executor with gpus = "all", or a shell executor with Docker), then set
# OCUDU_GPU_RUNNER_TAG to its tag to enable this job.
cuda gpu gates:
  stage: build and test
  needs: [lint]
  timeout: 4h
  tags:
    - ${OCUDU_GPU_RUNNER_TAG}
  rules:
    - if: $OCUDU_GPU_RUNNER_TAG
  variables:
    IMAGE: ocudu-dapp-release:cuda-gpu-ci
  script:
    - set -o pipefail
    - scripts/fetch_sources.sh "${OCUDU_WORKSPACE}"
    - >-
      OCUDU_BUILD_VARIANT=cuda OCUDU_CUDA_IMAGE_TAG="${IMAGE}"
      OCUDU_DOCKER_BUILD_ARGS="--progress=plain"
      "${OCUDU_WORKSPACE}/ocudu-docker/scripts/build.sh"
    - docker run --rm --gpus all "${IMAGE}" bash /work/ocudu-docker/scripts/run_cuda_tests.sh 2>&1 | tee cuda-gpu-tests.log
  artifacts:
    when: always
    paths:
      - "*.log"
    expire_in: 30 days
